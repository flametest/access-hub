AppConfig:
  name: access-hub
  addr: 0.0.0.0:8080
  env: dev
  withStack: true
LogLevel: 0
Datasource:
  dialect: postgres
  host: 127.0.0.1
  port: 5433
  username: accesshub
  password: accesshub
  database: accesshub
  schema: public
  debug: false
Redis:
  addr: 127.0.0.1:6379
  db: 0
Auth:
  accessTokenTTL: 15m
  refreshTokenTTL: 720h
  rsaPrivateKeyPath: deploy/keys/private.pem
  rsaPublicKeyPath: deploy/keys/public.pem
  emailCodeTTL: 10m
  emailCodeMaxAttempts: 5
  sendCodeInterval: 60s
  sendCodeIPLimit: 10
  loginMaxAttempts: 5
  loginLockDuration: 15m
  allowAutoRegister: false
  bcryptCost: 12
  issuerURL: http://localhost:8080
  mfaTokenTTL: 5m
  # fail-close by default: when Redis is down, token revocation cannot be
  # checked and requests are rejected. Set true only if availability beats
  # revocation strictness during a Redis outage.
  denylistFailOpen: false
  # Peers (IP or CIDR) whose X-Forwarded-For is trusted for client-IP
  # extraction. Empty = never trust XFF (use the direct peer address).
  trustedProxies: []
  portalURL: http://localhost:3000
Mailer:
  driver: console
  smtp:
    host: 127.0.0.1
    port: 1025
    username: ""
    password: ""
    from: no-reply@access-hub.local
Social:
  google:
    clientId: ""
    clientSecret: ""
  microsoft:
    clientId: ""
    clientSecret: ""
    tenant: common
  facebook:
    clientId: ""
    clientSecret: ""
  apple:
    servicesId: ""
    teamId: ""
    keyId: ""
    privateKeyPath: deploy/keys/apple/AuthKey.p8
Bootstrap:
  adminUsername: admin
  adminEmail: admin@access-hub.local
  adminPassword: ""
