services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: accesshub
      POSTGRES_PASSWORD: accesshub
      POSTGRES_DB: accesshub
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accesshub"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025" # SMTP: point mailer.driver=smtp here in dev
      - "8025:8025" # Web UI: http://localhost:8025

volumes:
  pgdata:
